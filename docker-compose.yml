version: "3.8"

services:
  aegis-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aegis-eval:v4.1.0-hardened
    container_name: aegis_api
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - "ALL"
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=100m"
    environment:
      - AEGIS_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://aegis_app:${DB_PASSWORD}@postgres:5432/aegis_eval}
      - AEGIS_API_SECRET=${AEGIS_API_SECRET}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg15
    container_name: aegis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-aegis_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_production_secret}
      POSTGRES_DB: ${DB_NAME:-aegis_eval}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aegis_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
